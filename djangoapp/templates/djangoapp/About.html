<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>About Us</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }
        nav {
            background-color: #009688; /* turquoise navbar */
            padding: 1rem;
            color: white;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        .container {
            padding: 2rem;
            max-width: 1000px;
            margin: auto;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .description {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            color: #555;
        }
        .team {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            width: 250px;
            margin: 1rem;
            padding: 1rem;
            text-align: center;
        }
        .card img {
            width: 100%;
            border-radius: 8px;
        }
        .card h3 {
            margin: 0.5rem 0;
            color: #009688;
        }
        .card p {
            color: #666;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/about">About Us</a>
        <a href="/contact">Contact</a>
    </nav>

    <div class="container">
        <h1>About Our Dealership</h1>
        <p class="description">
            We are committed to providing the best vehicles and customer service.
            Our dealership has been serving communities with passion and integrity.
        </p>

        <div class="team">
            <div class="card">
                <img src="https://via.placeholder.com/250x150" alt="Team Member 1">
                <h3>Jane Doe</h3>
                <p>Founder & CEO</p>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/250x150" alt="Team Member 2">
                <h3>John Smith</h3>
                <p>Sales Manager</p>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/250x150" alt="Team Member 3">
                <h3>Mary Johnson</h3>
                <p>Customer Support</p>
            </div>
        </div>
    </div>
</body>
</html>
